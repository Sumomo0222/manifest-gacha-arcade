<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0718">
<title>霓虹游戏厅 · 祝福显化扭蛋机</title>
<meta name="description" content="走进夜晚的霓虹游戏厅，投入一枚心愿币，转动旋钮，抽一张属于今晚的祝福签。创意互动，不构成现实承诺。">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="%23ff8fd8"/><path d="M3.2 18.5a13 13 0 0 0 25.6 0z" fill="%23fff" opacity=".9"/><circle cx="11" cy="10" r="3" fill="%23fff" opacity=".7"/></svg>'>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="scene" id="scene">

  <!-- ═══ 背景：墙面 / 霓虹灯牌 / 剪影 / 散景 ═══ -->
  <div class="wall">
    <div class="wall-pattern"></div>
    <div class="bokeh-field" id="bokehField"></div>

    <div class="neon neon-arcade">
      <span class="neon-cn">银河游戏厅</span>
      <span class="neon-en">GALAXY ARCADE</span>
    </div>
    <div class="neon neon-gacha neon--flicker">心愿扭蛋</div>
    <div class="neon neon-open">显化屋 · OPEN 24H</div>
    <div class="neon neon-lucky">★ LUCKY ★</div>
    <div class="neon neon-coin">COIN ×2</div>

    <div class="silhouette sil-1"></div>
    <div class="silhouette sil-2"></div>
    <div class="silhouette sil-3"></div>
    <div class="wall-strip"></div>
  </div>

  <!-- ═══ 地面：透视地砖 + 反光 ═══ -->
  <div class="floor">
    <div class="floor-tiles"></div>
    <div class="floor-reflection reflect-left"></div>
    <div class="floor-reflection reflect-right"></div>
    <div class="floor-reflection reflect-center"></div>
  </div>

  <!-- ═══ 中景：虚化的游戏厅机器 ═══ -->
  <div class="mid">

    <div class="bg-m bg-claw">
      <div class="bgm-top">CLAW 娃娃机</div>
      <div class="bgm-glass">
        <span class="claw-line"></span>
        <i class="toy toy-1"></i><i class="toy toy-2"></i><i class="toy toy-3"></i><i class="toy toy-4"></i>
      </div>
      <div class="bgm-panel">
        <i class="stick"></i><i class="btn btn-a"></i><i class="btn btn-b"></i>
      </div>
      <div class="bgm-foot"></div>
    </div>

    <div class="bg-m bg-exchange">
      <div class="bgm-top">两替 COIN</div>
      <div class="bgm-body">
        <i class="slotcol"></i><i class="slotcol"></i><i class="slotcol"></i>
      </div>
      <div class="bgm-foot"></div>
    </div>

    <div class="bg-m bg-minigacha">
      <div class="mg-dome"><i></i><i></i><i></i></div>
      <div class="mg-body"><i class="mg-knob"></i></div>
      <div class="mg-foot"></div>
    </div>

    <div class="bg-m bg-arcade">
      <div class="bgm-marquee">RACE</div>
      <div class="bgm-screen">
        <i class="scr-road"></i><i class="scr-car"></i>
      </div>
      <div class="bgm-deck">
        <i class="stick"></i><i class="btn btn-a"></i><i class="btn btn-b"></i>
      </div>
      <div class="bgm-foot"></div>
    </div>

  </div>

  <!-- ═══ 前景：主祝福显化扭蛋机 ═══ -->
  <div class="stage">
    <div class="machine" id="machine" data-state="idle">
      <div class="m-aura"></div>

      <div class="m-sign">
        <span class="m-sign-cn">心愿显化扭蛋</span>
        <span class="m-sign-en">MANIFEST GACHA</span>
      </div>

      <div class="m-dome">
        <div class="dome-caps" id="domeCaps"></div>
        <div class="dome-shelf"></div>
        <div class="dome-shine"></div>
      </div>

      <div class="m-neck"></div>

      <div class="m-body">
        <div class="m-screen">
          <span class="m-screen-text" id="screenText" aria-live="polite">等待心愿币 · INSERT COIN</span>
          <span class="m-screen-cursor"></span>
        </div>
        <div class="m-slot" id="coinSlot" role="button" tabindex="0" aria-label="投币口：点击投入心愿币">
          <span class="slot-slit"></span>
          <span class="slot-label">心愿币 INSERT</span>
        </div>
        <button class="m-knob" id="knobBtn" aria-label="转动旋钮">
          <span class="knob-rotor" id="knobRotor">
            <span class="knob-grip"></span>
            <span class="knob-face">
              <i class="kf-arrow a1"></i><i class="kf-arrow a2"></i><i class="kf-arrow a3"></i>
            </span>
            <span class="knob-cap"></span>
          </span>
        </button>
        <div class="m-outlet" id="outlet">
          <span class="outlet-label">OUT</span>
          <span class="outlet-flap"></span>
        </div>
      </div>

      <div class="m-tray" id="tray"><span class="tray-inner"></span></div>

      <div class="m-base">
        <span class="base-vent v1"></span><span class="base-vent v2"></span>
      </div>

      <div class="m-shadow"></div>
      <div class="drop-layer" id="dropLayer"></div>
    </div>
  </div>

  <div class="vignette"></div>
  <div class="scene-note">✦ 创意互动装置 · 显化指情绪价值，不构成现实承诺</div>
</div>

<button class="coin-cta pulse" id="cta">投入心愿币 ✦</button>

<!-- ═══ 祝福卡弹窗 ═══ -->
<div class="card-overlay" id="overlay" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="blessing-card">
    <div class="bc-head">✦ BLESSING TICKET ✦</div>
    <div class="bc-icon" id="bcIcon">✨</div>
    <h2 class="bc-name" id="bcName">灵感显影</h2>
    <div class="bc-divider"><i></i><span>✦</span><i></i></div>
    <p class="bc-hint" id="bcHint"></p>
    <div class="bc-action">
      <span class="bc-action-label">今日小行动</span>
      <p id="bcAction"></p>
    </div>
    <p class="bc-share" id="bcShare"></p>
    <div class="bc-btns">
      <button class="bc-btn bc-btn-copy" id="btnCopy">复制祝福</button>
      <button class="bc-btn bc-btn-again" id="btnAgain">再抽一次</button>
    </div>
    <div class="copy-fallback" id="copyFallback" hidden>
      <p>浏览器限制了自动复制，长按 / 全选手动复制：</p>
      <textarea id="copyText" readonly></textarea>
    </div>
    <p class="bc-note">创意互动签 · 愿望靠每一次小行动显化 · 不构成现实承诺</p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
